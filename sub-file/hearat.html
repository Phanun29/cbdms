<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nighttime Floral Scene</title>
<style>
    /* Basic styling */
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #0d1b2a;
        overflow: hidden;
    }

    /* Glowing flower stem */
    .stem {
        position: absolute;
        bottom: 20%;
        width: 2px;
        height: 150px;
        background-color: #357a38;
        animation: sway 2s infinite ease-in-out;
    }

    /* Flower bloom */
    .flower {
        position: absolute;
        top: -20px;
        width: 40px;
        height: 40px;
        background-color: #8fd3f4;
        border-radius: 50% 50% 0 0;
        transform: rotate(45deg);
        animation: glow 1.5s infinite alternate;
        box-shadow: 0 0 10px rgba(143, 211, 244, 0.6);
    }

    .flower::before, .flower::after {
        content: '';
        position: absolute;
        width: 40px;
        height: 40px;
        background-color: #8fd3f4;
        border-radius: 50% 50% 0 0;
        transform: rotate(-45deg);
        animation: glow 1.5s infinite alternate;
        box-shadow: 0 0 10px rgba(143, 211, 244, 0.6);
    }

    .flower::before {
        left: -20px;
        top: 0;
    }
    .flower::after {
        left: 20px;
        top: 0;
    }

    /* Leaves */
    .leaf {
        position: absolute;
        width: 50px;
        height: 15px;
        background-color: #1f6f5c;
        border-radius: 50%;
        transform-origin: left center;
    }
    .leaf:nth-child(1) {
        top: 40px;
        left: -25px;
        transform: rotate(-40deg);
    }
    .leaf:nth-child(2) {
        top: 60px;
        left: -25px;
        transform: rotate(20deg);
    }

    /* Fireflies */
    .firefly {
        position: absolute;
        width: 5px;
        height: 5px;
        background-color: yellow;
        border-radius: 50%;
        opacity: 0.8;
        animation: float 3s ease-in-out infinite;
    }

    .firefly:nth-child(1) { top: 10%; left: 80%; animation-delay: 1s; }
    .firefly:nth-child(2) { top: 30%; left: 20%; animation-delay: 2s; }
    .firefly:nth-child(3) { top: 50%; left: 70%; animation-delay: 3s; }
    .firefly:nth-child(4) { top: 80%; left: 50%; animation-delay: 1.5s; }

    /* Animations */
    @keyframes glow {
        0% { opacity: 0.6; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
    }

    @keyframes sway {
        0%, 100% { transform: rotate(2deg); }
        50% { transform: rotate(-2deg); }
    }

    @keyframes float {
        0% { opacity: 0.5; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-10px); }
        100% { opacity: 0.5; transform: translateY(0); }
    }
</style>
</head>
<body>

<!-- Flower and stem structure -->
<div class="stem">
    <div class="flower"></div>
    <div class="leaf"></div>
    <div class="leaf"></div>
</div>

<!-- Fireflies -->
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>
<div class="firefly"></div>

</body>
</html>
